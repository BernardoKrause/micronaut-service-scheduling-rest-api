#Tue Jan 06 13:28:07 UTC 2026
micronaut.application.name=micronaut-service-scheduling-rest-api

# PostgreSQL Datasource Configuration
datasources.default.db-type=postgresql
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.url=jdbc:postgresql://localhost:5432/service_db
datasources.default.username=${PG_USER}
datasources.default.password=${PG_PASSWORD}

# Schema generation (para desenvolvimento)
datasources.default.schema-generate=CREATE_DROP
# Opções: CREATE_DROP (recria a cada start [dev]), UPDATE (atualiza [staging]), NONE (não gera [prod])

# Basic Auth Configuration
micronaut.security.enabled=true
micronaut.security.authentication=basic
AUTH_USER=${AUTH_USER}
AUTH_SECRET=${AUTH_SECRET}